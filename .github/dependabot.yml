version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"

  - package-ecosystem: pip
    directory: /.github
    schedule:
      interval: weekly
    groups:
      linters:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
