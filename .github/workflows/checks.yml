name: Code checks (reusable)

on:
  workflow_call:
    inputs:
      deps:
        description: Extra pip packages so pyright can resolve third-party imports
        required: false
        type: string
        default: ''
      kodistubs:
        description: kodistubs version; 21.0.0 is the newest published
        required: false
        type: string
        default: '21.0.0'

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install pyright==1.1.411 kodistubs==${{ inputs.kodistubs }} ruff==0.16.3 ${{ inputs.deps }}
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright
