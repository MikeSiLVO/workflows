name: Code checks (reusable)

on:
  workflow_call:
    inputs:
      deps:
        description: Extra pip packages so pyright can resolve third-party imports
        required: false
        type: string
        default: ''
      kodistubs:
        description: kodistubs version; 21.0.0 is the newest published
        required: false
        type: string
        default: '21.0.0'
      tests:
        description: Also run pytest over tests/ on Python 3.12, in its own job
        required: false
        type: boolean
        default: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # the linter pins live in this repo, not the caller's, so fetch just that file
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .lint-pins
          sparse-checkout: .github/requirements-lint.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          pip install -r .lint-pins/.github/requirements-lint.txt \
            kodistubs==${{ inputs.kodistubs }} ${{ inputs.deps }}
      - name: Ruff
        run: ruff check .
      - name: Pyright
        run: pyright

  tests:
    if: inputs.tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .test-pins
          sparse-checkout: .github/requirements-test.txt
          sparse-checkout-cone-mode: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install pytest
        run: pip install -r .test-pins/.github/requirements-test.txt
      - name: Pytest
        run: python -m pytest tests -q
